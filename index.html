<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Composition Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
    }

    /* 상단 직관적 안내 HUD */
    #hud-bar {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      z-index: 25;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    /* 포커스 해제 버튼 */
    #reset-focus-btn {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 14px;
      z-index: 25;
      display: none;
      cursor: pointer;
    }

    /* 하단 심플 컨트롤 바 */
    #controls {
      position: absolute;
      bottom: 35px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
      padding: 0 40px;
    }
    .sub-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #shutter-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      transition: transform 0.1s ease;
    }
    #shutter-btn:active #shutter-inner {
      transform: scale(0.88);
    }
    /* 완벽 구도 시 셔터 버튼 강조 */
    #shutter-btn.perfect-ready {
      border-color: #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.8);
    }
    #shutter-btn.perfect-ready #shutter-inner {
      background: #22c55e;
    }

    /* 플래시 효과 */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
    }
    .flash-anim { animation: flash 0.25s ease-out; }
    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* 결과 미리보기 모달 */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 40px;
    }
    #preview-img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      object-fit: contain;
    }
    .modal-actions {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }
    .action-btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #btn-retake { background: #27272a; color: #fff; }
    #btn-save { background: #22c55e; color: #fff; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash-overlay"></div>

    <!-- 가이드 안내 HUD -->
    <div id="hud-bar">
      <span id="hud-icon">📐</span>
      <span id="hud-text">스마트폰 수평을 맞추세요</span>
    </div>
    <button id="reset-focus-btn">포커스 해제 ✕</button>

    <!-- 하단 컨트롤 (자동 촬영 버튼 제거됨) -->
    <div id="controls">
      <div style="width: 50px;"></div> <!-- 좌우 대칭용 여백 -->
      <div id="shutter-btn"><div id="shutter-inner"></div></div>
      <button class="sub-btn" id="flip-btn">전환</button>
    </div>
  </div>

  <!-- 결과 미리보기 모달 -->
  <div id="preview-modal">
    <div style="color: #4ade80; font-size: 14px; font-weight: 700; margin-top: 10px;">✨ 베스트 샷 구도 촬영 완료</div>
    <img id="preview-img" alt="촬영된 사진">
    <div class="modal-actions">
      <button class="action-btn" id="btn-retake">다시 찍기</button>
      <button class="action-btn" id="btn-save">저장하기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const hudBar = document.getElementById('hud-bar');
    const hudIcon = document.getElementById('hud-icon');
    const hudText = document.getElementById('hud-text');
    const resetFocusBtn = document.getElementById('reset-focus-btn');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipBtn = document.getElementById('flip-btn');
    const flashOverlay = document.getElementById('flash-overlay');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const btnRetake = document.getElementById('btn-retake');
    const btnSave = document.getElementById('btn-save');

    let currentStream = null;
    let facingMode = 'environment';
    let capturedBlob = null;

    // 수평 센서 상태
    let tiltAngle = 0;       // 좌우 롤링 각도
    let isLevel = false;     // 수평 일치 여부 (오차 1.8도 이내)

    // 피사체 및 샷 서제스천 타깃 좌표
    let hasTargetLock = false;
    let subjectDot = null;   // 사용자가 터치한 피사체 점
    let targetSpot = null;   // 최적의 3분할 교차점
    let lastBeta = null, lastGamma = null;

    // 1. 카메라 스트림 연결
    async function setupCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = {
        video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          resolve();
        };
      });
    }

    function resizeCanvas() {
      overlay.width = video.videoWidth || window.innerWidth;
      overlay.height = video.videoHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 2. 디지털 수평 센서 연동 (DeviceOrientation)
    function initSensors() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.gamma !== null && e.beta !== null) {
            // 세로 모드 기준 좌우 기울기
            tiltAngle = e.gamma;
            isLevel = Math.abs(tiltAngle) < 1.8;

            // 카메라 움직임에 따라 피사체 점의 상대 좌표 보정 (물체 위치 유지)
            if (hasTargetLock && subjectDot && lastBeta !== null && lastGamma !== null) {
              const deltaX = (e.gamma - lastGamma) * 14;
              const deltaY = (e.beta - lastBeta) * 14;
              subjectDot.x -= deltaX;
              subjectDot.y -= deltaY;
            }
            lastBeta = e.beta;
            lastGamma = e.gamma;
          }
        });
      }
    }

    // 3. 뷰파인더 터치 (피사체 포커싱 & 황금 구도 생성)
    overlay.addEventListener('pointerdown', (e) => {
      const rect = overlay.getBoundingClientRect();
      const scaleX = overlay.width / rect.width;
      const scaleY = overlay.height / rect.height;
      const touchX = (e.clientX - rect.left) * scaleX;
      const touchY = (e.clientY - rect.top) * scaleY;

      // 터치한 위치에 피사체 점 지정
      subjectDot = { x: touchX, y: touchY };
      hasTargetLock = true;
      resetFocusBtn.style.display = 'block';

      // 4대 3분할 교차점 중 가장 이상적인 타깃 지점 계산
      calculateOptimalSweetSpot(touchX, touchY);

      if (navigator.vibrate) navigator.vibrate(35);
    });

    resetFocusBtn.addEventListener('click', () => {
      hasTargetLock = false;
      subjectDot = null;
      targetSpot = null;
      resetFocusBtn.style.display = 'none';
      shutterBtn.classList.remove('perfect-ready');
    });

    function calculateOptimalSweetSpot(touchX, touchY) {
      const W = overlay.width;
      const H = overlay.height;
      const intersectionPoints = [
        { x: W / 3, y: H / 3 },
        { x: (W * 2) / 3, y: H / 3 },
        { x: W / 3, y: (H * 2) / 3 },
        { x: (W * 2) / 3, y: (H * 2) / 3 }
      ];

      // 터치한 위치에서 가장 가까운 3분할 포인트 선정
      let closest = intersectionPoints[0];
      let minDist = Infinity;
      intersectionPoints.forEach(pt => {
        const d = Math.hypot(pt.x - touchX, pt.y - touchY);
        if (d < minDist) {
          minDist = d;
          closest = pt;
        }
      });
      targetSpot = closest;
    }

    // 4. 메인 렌더링 루프
    function render() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      const W = overlay.width;
      const H = overlay.height;

      // (1) 3분할 그리드 라인 렌더링
      drawRuleOfThirdsGrid(W, H);

      // (2) 화면 중앙 수평계 가이드 라인 렌더링
      drawHorizonLevel(W, H);

      // (3) 구도 타깃 일치 및 화살표 가이드 판별
      evaluateComposition(W, H);

      requestAnimationFrame(render);
    }

    // 3분할 격자
    function drawRuleOfThirdsGrid(W, H) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 3, 0); ctx.lineTo(W / 3, H);
      ctx.moveTo((W * 2) / 3, 0); ctx.lineTo((W * 2) / 3, H);
      ctx.moveTo(0, H / 3); ctx.lineTo(W, H / 3);
      ctx.moveTo(0, (H * 2) / 3); ctx.lineTo(W, (H * 2) / 3);
      ctx.stroke();
      ctx.restore();
    }

    // 중앙 수평선 (오차 1.8도 이내면 초록색)
    function drawHorizonLevel(W, H) {
      const cy = H / 2;
      const len = W * 0.18;
      const rad = (tiltAngle * Math.PI) / 180;

      ctx.save();
      ctx.translate(W / 2, cy);
      ctx.rotate(-rad);

      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(len, 0);
      ctx.strokeStyle = isLevel ? '#22c55e' : 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = isLevel ? 3 : 1.5;
      ctx.stroke();

      // 중앙 십자 기준점
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fillStyle = isLevel ? '#22c55e' : '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    // 구도 상태 분석 및 UI 피드백
    function evaluateComposition(W, H) {
      // 1. 유저가 피사체를 지정하지 않은 초기 상태
      if (!hasTargetLock || !subjectDot) {
        if (!isLevel) {
          updateHUD('📐', '스마트폰을 똑바로 세워 수평을 맞추세요', '#f59e0b');
        } else {
          updateHUD('👆', '강조할 인물이나 사물을 화면에서 터치하세요', '#3b82f6');
        }
        shutterBtn.classList.remove('perfect-ready');
        return;
      }

      // 2. 피사체가 지정된 상태: 점(피사체)을 원(타깃) 안으로 유도
      const dist = Math.hypot(targetSpot.x - subjectDot.x, targetSpot.y - subjectDot.y);
      const hitRadius = Math.min(W, H) * 0.08; // 도킹 허용 반경
      const isTargetMatched = dist <= hitRadius;

      // 타깃 원 렌더링
      ctx.save();
      ctx.beginPath();
      ctx.arc(targetSpot.x, targetSpot.y, hitRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isTargetMatched ? '#22c55e' : '#facc15';
      ctx.lineWidth = isTargetMatched ? 4 : 2;
      ctx.setLineDash(isTargetMatched ? [] : [6, 6]);
      ctx.stroke();

      if (isTargetMatched) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
        ctx.fill();
      }
      ctx.restore();

      // 피사체 점 렌더링
      ctx.save();
      ctx.beginPath();
      ctx.arc(subjectDot.x, subjectDot.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = isTargetMatched ? '#22c55e' : '#ffd700';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.restore();

      // 판정: [수평 일치] + [타깃 일치] 모두 완료된 상태
      if (isLevel && isTargetMatched) {
        updateHUD('✨', '완벽한 구도! 지금 셔터를 누르세요', '#22c55e');
        shutterBtn.classList.add('perfect-ready');
      } 
      // 위치는 맞았으나 수평이 틀린 경우
      else if (isTargetMatched && !isLevel) {
        updateHUD('📐', '구도 일치! 이제 수평만 살짝 맞춰주세요', '#f59e0b');
        shutterBtn.classList.remove('perfect-ready');
      } 
      // 타깃 위치로 이동해야 하는 경우
      else {
        shutterBtn.classList.remove('perfect-ready');
        drawDirectionArrow(subjectDot, targetSpot);

        const dx = targetSpot.x - subjectDot.x;
        const dy = targetSpot.y - subjectDot.y;
        let h = Math.abs(dx) > 25 ? (dx > 0 ? '오른쪽' : '왼쪽') : '';
        let v = Math.abs(dy) > 25 ? (dy > 0 ? '아래' : '위') : '';
        let arrow = (dx > 0 && dy > 0) ? '↘' : (dx > 0 && dy < 0) ? '↗' : (dx < 0 && dy > 0) ? '↙' : '↖';

        if (h && v) updateHUD(arrow, `카메라를 ${h} ${v}로 이동하세요`, '#0284c7');
        else if (h) updateHUD(dx > 0 ? '➔' : '⬅', `카메라를 ${h}으로 이동하세요`, '#0284c7');
        else if (v) updateHUD(dy > 0 ? '⬇' : '⬆', `카메라를 ${v}로 이동하세요`, '#0284c7');
        else updateHUD('🎯', '원을 향해 조금만 더 이동하세요', '#0284c7');
      }
    }

    // 유도 화살표
    function drawDirectionArrow(from, to) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const len = 12;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - len * Math.cos(angle - Math.PI / 6), to.y - len * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - len * Math.cos(angle + Math.PI / 6), to.y - len * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
      ctx.restore();
    }

    function updateHUD(icon, text, bg) {
      hudIcon.innerText = icon;
      hudText.innerText = text;
      hudBar.style.background = bg;
    }

    // 5. 수동 촬영 및 저장
    function capturePhoto() {
      // 찰칵 플래시 연출
      flashOverlay.classList.remove('flash-anim');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-anim');
      if (navigator.vibrate) navigator.vibrate(60);

      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      const cCtx = captureCanvas.getContext('2d');

      // AI 카메라 색감 보정 (대비 +10%, 채도 +14%)
      cCtx.filter = 'contrast(1.10) saturate(1.14)';
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

      captureCanvas.toBlob(blob => {
        capturedBlob = blob;
        previewImg.src = URL.createObjectURL(blob);
        previewModal.style.display = 'flex';
      }, 'image/jpeg', 0.95);
    }

    shutterBtn.addEventListener('click', capturePhoto);

    flipBtn.addEventListener('click', async () => {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      await setupCamera();
    });

    btnRetake.addEventListener('click', () => {
      previewModal.style.display = 'none';
      capturedBlob = null;
    });

    // 다운로드 즉시 실행 (갤러리 직행)
    btnSave.addEventListener('click', () => {
      if (!capturedBlob) return;
      const fileName = `best_shot_${Date.now()}.jpg`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(capturedBlob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      previewModal.style.display = 'none';
    });

    // 시작
    setupCamera().then(() => {
      initSensors();
      render();
    });
  </script>
</body>
</html>
