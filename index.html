<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Smart Camera</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
    }

    #hud-container {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 25;
      pointer-events: none;
    }
    #hud-bar {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center;
      transition: all 0.25s ease;
    }
    #env-warning-bar {
      background: rgba(220, 38, 38, 0.92);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 700;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    #reset-btn {
      position: absolute;
      top: 38px;
      right: 16px;
      background: rgba(239, 68, 68, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
      z-index: 30;
      display: none;
      cursor: pointer;
    }

    #mode-selector {
      position: absolute;
      bottom: 122px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 4px;
      z-index: 25;
      gap: 4px;
    }
    .mode-tab {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-tab.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.5);
    }

    #controls {
      position: absolute;
      bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
      padding: 0 25px;
    }
    .btn-circle {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-sub {
      width: 52px;
      height: 52px;
      font-size: 11px;
      font-weight: 700;
    }
    .btn-sub.active {
      background: #22c55e;
      border-color: #4ade80;
    }
    #shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    #shutter-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      transition: transform 0.1s ease;
    }
    #shutter-btn:active #shutter-inner {
      transform: scale(0.88);
    }

    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 40px;
    }
    #preview-img {
      max-width: 100%;
      max-height: 72vh;
      border-radius: 16px;
      object-fit: contain;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }
    .action-btn {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #btn-retake { background: #27272a; color: #fff; }
    #btn-save { background: #22c55e; color: #fff; }

    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
    }
    .flash-anim { animation: flash 0.3s ease-out; }
    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash-overlay"></div>

    <div id="hud-container">
      <div id="hud-bar">
        <span id="hud-icon">✏️</span>
        <span id="hud-text">촬영할 사물 주변을 올가미로 그리거나 탭하세요</span>
      </div>
      <div id="env-warning-bar">⚠️ 배경이 너무 산만합니다. 정돈된 각도를 찾아보세요</div>
    </div>

    <button id="reset-btn">대상 변경 ✕</button>

    <div id="mode-selector">
      <button class="mode-tab active" id="tab-object">
        <span>✏️</span> 1. 사물 선택
      </button>
      <button class="mode-tab" id="tab-person">
        <span>👤</span> 2. 인물 선택
      </button>
    </div>

    <div id="controls">
      <button class="btn-circle btn-sub" id="auto-btn">
        <span id="auto-text">AUTO<br>OFF</span>
      </button>
      <div id="shutter-btn"><div id="shutter-inner"></div></div>
      <button class="btn-circle btn-sub" id="flip-btn">전환</button>
    </div>
  </div>

  <div id="preview-modal">
    <div style="color: #4ade80; font-size: 14px; font-weight: 700; margin-top: 10px;">✨ AI 구도 촬영 완료</div>
    <img id="preview-img" alt="촬영된 사진">
    <div class="modal-actions">
      <button class="action-btn" id="btn-retake">다시 찍기</button>
      <button class="action-btn" id="btn-save">저장하기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const hudBar = document.getElementById('hud-bar');
    const hudIcon = document.getElementById('hud-icon');
    const hudText = document.getElementById('hud-text');
    const envWarningBar = document.getElementById('env-warning-bar');
    const resetBtn = document.getElementById('reset-btn');
    const tabObject = document.getElementById('tab-object');
    const tabPerson = document.getElementById('tab-person');
    const autoBtn = document.getElementById('auto-btn');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipBtn = document.getElementById('flip-btn');
    const flashOverlay = document.getElementById('flash-overlay');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const btnRetake = document.getElementById('btn-retake');
    const btnSave = document.getElementById('btn-save');

    let currentMode = 'OBJECT';
    let isAutoShoot = false;
    let facingMode = 'environment';
    let currentStream = null;
    let capturedBlob = null;
    let lockTimer = null;
    let isLocked = false;

    let isEnvironmentBad = false;

    // 사물 트래커 변수
    let isDrawingLasso = false;
    let lassoPoints = [];
    let selectedObjectBox = null;
    let objectTemplate = null;
    const trackerCanvas = document.createElement('canvas');
    const trackerCtx = trackerCanvas.getContext('2d', { willReadFrequently: true });
    trackerCanvas.width = 160;
    trackerCanvas.height = 120;

    // 인물 변수
    let faceDetector = null;
    let detectedPeople = [];
    let selectedPerson = null;
    let isDetectingFaces = false;

    // 환경 진단용 캔버스
    const diagCanvas = document.createElement('canvas');
    const diagCtx = diagCanvas.getContext('2d', { willReadFrequently: true });
    diagCanvas.width = 120;
    diagCanvas.height = 90;

    async function setupCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = {
        video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          resolve();
        };
      });
    }

    function resizeCanvas() {
      overlay.width = video.videoWidth || window.innerWidth;
      overlay.height = video.videoHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function initFaceDetector() {
      try {
        faceDetector = new FaceDetection({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
        });
        faceDetector.setOptions({ model: 'short', minDetectionConfidence: 0.55 });
        faceDetector.onResults(onFaceResults);
      } catch (e) {
        console.warn('FaceDetector 초기화 실패:', e);
      }
    }

    tabObject.addEventListener('click', () => {
      currentMode = 'OBJECT';
      tabObject.classList.add('active');
      tabPerson.classList.remove('active');
      resetSelection();
      updateHUD('✏️', '촬영할 사물 주변을 올가미로 그리거나 탭하세요', 'rgba(15, 23, 42, 0.88)');
    });

    tabPerson.addEventListener('click', () => {
      currentMode = 'PERSON';
      tabPerson.classList.add('active');
      tabObject.classList.remove('active');
      resetSelection();
      updateHUD('👤', '화면에 인물을 비추고 주인공을 탭하세요', '#3b82f6');
    });

    resetBtn.addEventListener('click', resetSelection);

    function resetSelection() {
      selectedObjectBox = null;
      objectTemplate = null;
      lassoPoints = [];
      selectedPerson = null;
      isLocked = false;
      clearTimeout(lockTimer);
      resetBtn.style.display = 'none';

      if (currentMode === 'OBJECT') {
        updateHUD('✏️', '촬영할 사물 주변을 올가미로 그리거나 탭하세요', 'rgba(15, 23, 42, 0.88)');
      } else {
        updateHUD('👤', '화면에 인물을 비추고 주인공을 탭하세요', '#3b82f6');
      }
    }

    // 터치 입력 처리
    overlay.addEventListener('pointerdown', (e) => {
      const pos = getEventPos(e);

      if (currentMode === 'PERSON') {
        handlePersonSelection(pos.x, pos.y);
      } else {
        isDrawingLasso = true;
        lassoPoints = [pos];
        selectedObjectBox = null;
        objectTemplate = null;
      }
    });

    overlay.addEventListener('pointermove', (e) => {
      if (currentMode === 'OBJECT' && isDrawingLasso) {
        lassoPoints.push(getEventPos(e));
      }
    });

    overlay.addEventListener('pointerup', () => {
      if (currentMode === 'OBJECT' && isDrawingLasso) {
        isDrawingLasso = false;
        const W = overlay.width, H = overlay.height;

        if (lassoPoints.length < 6) {
          const p = lassoPoints[0];
          const bSize = Math.min(W, H) * 0.22;
          selectedObjectBox = {
            x: Math.max(10, p.x - bSize / 2),
            y: Math.max(10, p.y - bSize / 2),
            w: bSize,
            h: bSize
          };
        } else {
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          lassoPoints.forEach(pt => {
            if (pt.x < minX) minX = pt.x;
            if (pt.x > maxX) maxX = pt.x;
            if (pt.y < minY) minY = pt.y;
            if (pt.y > maxY) maxY = pt.y;
          });
          selectedObjectBox = {
            x: minX,
            y: minY,
            w: Math.max(40, maxX - minX),
            h: Math.max(40, maxY - minY)
          };
        }

        // 사물 특징 패치 추출 (트래킹용)
        initObjectTracker();
        resetBtn.style.display = 'block';
        updateHUD('🎯', '사물이 선택되었습니다. 원에 맞춰보세요', '#38bdf8');
        if (navigator.vibrate) navigator.vibrate(40);
      }
    });

    function getEventPos(e) {
      const rect = overlay.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (overlay.width / rect.width),
        y: (e.clientY - rect.top) * (overlay.height / rect.height)
      };
    }

    // 사물 패치 템플릿 생성 (16x16 명암 특징)
    function initObjectTracker() {
      if (!selectedObjectBox) return;
      const cx = selectedObjectBox.x + selectedObjectBox.w / 2;
      const cy = selectedObjectBox.y + selectedObjectBox.h / 2;

      trackerCtx.drawImage(video, cx - 30, cy - 30, 60, 60, 0, 0, 16, 16);
      const img = trackerCtx.getImageData(0, 0, 16, 16).data;
      objectTemplate = new Float32Array(16 * 16);
      for (let i = 0; i < img.length; i += 4) {
        objectTemplate[i / 4] = 0.299 * img[i] + 0.587 * img[i+1] + 0.114 * img[i+2];
      }
    }

    // 카메라 이동 시 사물 추적 갱신
    function updateObjectTracking() {
      if (!selectedObjectBox || !objectTemplate) return;
      const cx = selectedObjectBox.x + selectedObjectBox.w / 2;
      const cy = selectedObjectBox.y + selectedObjectBox.h / 2;

      const searchW = 120;
      trackerCtx.drawImage(video, cx - searchW / 2, cy - searchW / 2, searchW, searchW, 0, 0, 48, 48);
      const searchData = trackerCtx.getImageData(0, 0, 48, 48).data;

      let minDiff = Infinity, bestDx = 0, bestDy = 0;
      for (let sy = 0; sy <= 32; sy += 2) {
        for (let sx = 0; sx <= 32; sx += 2) {
          let diff = 0;
          for (let py = 0; py < 16; py += 2) {
            for (let px = 0; px < 16; px += 2) {
              const idx = ((sy + py) * 48 + (sx + px)) * 4;
              const gray = 0.299 * searchData[idx] + 0.587 * searchData[idx+1] + 0.114 * searchData[idx+2];
              diff += Math.abs(gray - objectTemplate[py * 16 + px]);
            }
          }
          if (diff < minDiff) {
            minDiff = diff;
            bestDx = (sx - 16) * (searchW / 48);
            bestDy = (sy - 16) * (searchW / 48);
          }
        }
      }

      if (minDiff < 3800) {
        selectedObjectBox.x += bestDx * 0.45;
        selectedObjectBox.y += bestDy * 0.45;
      }
    }

    // 인물 터치 선택 (실제 얼굴 감지 영역만 인정)
    function handlePersonSelection(touchX, touchY) {
      if (detectedPeople.length === 0) {
        updateHUD('⚠️', '인물이 감지되지 않았습니다. 사람을 비춰주세요', '#ef4444');
        return;
      }

      let closest = null, minDist = Infinity;
      detectedPeople.forEach(p => {
        const cx = p.box.x + p.box.w / 2;
        const cy = p.box.y + p.box.h * 0.9;
        const d = Math.hypot(cx - touchX, cy - touchY);
        if (d < minDist) {
          minDist = d;
          closest = p;
        }
      });

      if (closest && minDist < Math.max(closest.box.w * 1.8, 140)) {
        selectedPerson = { ...closest };
        resetBtn.style.display = 'block';
        updateHUD('⭐', '주인공이 지정되었습니다! 눈높이를 맞추세요', '#a855f7');
        if (navigator.vibrate) navigator.vibrate(50);
      } else {
        updateHUD('⚠️', '인물의 얼굴이나 상반신을 정확히 터치하세요', '#ef4444');
      }
    }

    // 환경 복잡도 진단
    function analyzeEnvironment() {
      diagCtx.drawImage(video, 0, 0, 120, 90);
      const data = diagCtx.getImageData(0, 0, 120, 90).data;
      let edges = 0;

      for (let y = 1; y < 89; y += 2) {
        for (let x = 1; x < 119; x += 2) {
          const idx = (y * 120 + x) * 4;
          const gray = 0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2];
          const right = 0.299 * data[idx+4] + 0.587 * data[idx+5] + 0.114 * data[idx+6];
          const down = 0.299 * data[idx+480] + 0.587 * data[idx+481] + 0.114 * data[idx+482];
          if (Math.abs(gray - right) + Math.abs(gray - down) > 48) edges++;
        }
      }

      // 복잡한 방(옷걸이/책장 난립) 감지 기준
      if (edges > 620) {
        isEnvironmentBad = true;
        envWarningBar.innerText = '⚠️ 배경에 물건이 너무 많아 산만합니다. 깔끔한 곳을 비춰보세요';
        envWarningBar.style.display = 'block';
      } else {
        isEnvironmentBad = false;
        envWarningBar.style.display = 'none';
      }
    }

    let loopFrame = 0;
    async function renderLoop() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      drawGrid();

      if (++loopFrame % 10 === 0) analyzeEnvironment();

      if (currentMode === 'OBJECT') {
        renderObjectMode();
      } else {
        await renderPersonMode();
      }

      requestAnimationFrame(renderLoop);
    }

    function renderObjectMode() {
      if (isDrawingLasso && lassoPoints.length > 1) {
        ctx.save();
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for (let i = 1; i < lassoPoints.length; i++) ctx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        ctx.stroke();
        ctx.restore();
      }

      if (selectedObjectBox) {
        updateObjectTracking();
        drawBox(selectedObjectBox, '#38bdf8', '선택된 사물');
        guideToRuleOfThirds(selectedObjectBox);
      }
    }

    async function renderPersonMode() {
      if (faceDetector && !isDetectingFaces && video.readyState === video.HAVE_ENOUGH_DATA) {
        isDetectingFaces = true;
        await faceDetector.send({ image: video });
        isDetectingFaces = false;
      }

      if (!selectedPerson) {
        if (detectedPeople.length === 0) {
          updateHUD('👤', '화면에 인물을 비춰주세요', '#3b82f6');
        } else {
          updateHUD('👆', `${detectedPeople.length}명의 인물 감지됨! 촬영할 인물을 탭하세요`, '#facc15');
          detectedPeople.forEach((p, idx) => drawCandidatePerson(p.box, `인물 ${idx + 1}`));
        }
      } else {
        updateSelectedPersonTrack();
        drawHeroPerson(selectedPerson.box);
        guidePortraitComposition(selectedPerson.box);
      }
    }

    function onFaceResults(results) {
      if (currentMode !== 'PERSON') return;
      const W = overlay.width, H = overlay.height;
      detectedPeople = [];

      if (results.detections && results.detections.length > 0) {
        results.detections.forEach((det, idx) => {
          const bb = det.boundingBox;
          const box = {
            x: bb.xCenter * W - (bb.width * W) / 2,
            y: bb.yCenter * H - (bb.height * H) / 2,
            w: bb.width * W,
            h: bb.height * H
          };
          let eyeY = box.y + box.h * 0.35;
          if (det.landmarks && det.landmarks.length >= 2) {
            eyeY = ((det.landmarks[0].y + det.landmarks[1].y) / 2) * H;
          }
          detectedPeople.push({ id: `p_${idx}`, box, eyeY });
        });
      }
    }

    function updateSelectedPersonTrack() {
      if (!selectedPerson || detectedPeople.length === 0) return;
      let closest = null, minDist = Infinity;
      const prevCx = selectedPerson.box.x + selectedPerson.box.w / 2;
      const prevCy = selectedPerson.box.y + selectedPerson.box.h / 2;

      detectedPeople.forEach(p => {
        const d = Math.hypot(p.box.x + p.box.w / 2 - prevCx, p.box.y + p.box.h / 2 - prevCy);
        if (d < minDist) { minDist = d; closest = p; }
      });

      if (closest && minDist < 180) {
        selectedPerson.box.x += (closest.box.x - selectedPerson.box.x) * 0.45;
        selectedPerson.box.y += (closest.box.y - selectedPerson.box.y) * 0.45;
        selectedPerson.box.w += (closest.box.w - selectedPerson.box.w) * 0.45;
        selectedPerson.box.h += (closest.box.h - selectedPerson.box.h) * 0.45;
        selectedPerson.eyeY = closest.eyeY;
      }
    }

    function drawCandidatePerson(box, label) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(box.x, box.y, box.w, box.h * 1.8);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(box.x, box.y - 24, 96, 22);
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`👆 탭: ${label}`, box.x + 8, box.y - 8);
      ctx.restore();
    }

    function drawHeroPerson(box) {
      ctx.save();
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 3.5;
      ctx.strokeRect(box.x, box.y, box.w, box.h * 2.2);
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(box.x, box.y - 26, 92, 24);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('⭐ 주인공 선택됨', box.x + 8, box.y - 9);
      ctx.restore();
    }

    function guidePortraitComposition(box) {
      const H = overlay.height, W = overlay.width;
      const targetEyeLevel = H / 3;
      const curEyeY = box.eyeY || (box.y + box.h * 0.35);

      if (isEnvironmentBad) {
        updateHUD('⚠️', '배경이 너무 복잡합니다. 깔끔한 벽 쪽으로 이동하세요', '#ef4444');
        isLocked = false;
        return;
      }

      if (box.h * 2.2 < H * 0.2) {
        updateHUD('🔍', '인물이 너무 작습니다. 한 걸음 더 다가가세요', '#f97316');
        isLocked = false;
        return;
      }

      const diffY = targetEyeLevel - curEyeY;
      const isAligned = Math.abs(diffY) < H * 0.06;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, targetEyeLevel); ctx.lineTo(W, targetEyeLevel);
      ctx.strokeStyle = isAligned ? '#22c55e' : '#facc15';
      ctx.lineWidth = isAligned ? 3.5 : 1.5;
      ctx.stroke();
      ctx.restore();

      if (isAligned) {
        updateHUD('✨', isAutoShoot ? '완벽한 인물 구도! 촬영 중...' : '완벽한 인물 구도! 지금 셔터를 누르세요', '#22c55e');
        if (!isLocked) {
          isLocked = true;
          if (navigator.vibrate) navigator.vibrate(50);
          if (isAutoShoot) {
            clearTimeout(lockTimer);
            lockTimer = setTimeout(capturePhoto, 800);
          }
        }
      } else {
        isLocked = false;
        clearTimeout(lockTimer);
        updateHUD(diffY > 0 ? '⬇' : '⬆', `카메라를 ${diffY > 0 ? '아래로' : '위로'} 움직여 눈높이를 맞추세요`, '#0284c7');
      }
    }

    function guideToRuleOfThirds(box) {
      const W = overlay.width, H = overlay.height;
      const center = { x: box.x + box.w / 2, y: box.y + box.h / 2 };

      if (isEnvironmentBad) {
        updateHUD('⚠️', '배경에 물건이 너무 많습니다. 정돈된 각도를 찾아보세요', '#ef4444');
        isLocked = false;
        return;
      }

      const targets = [
        { x: W / 3, y: H / 3 }, { x: (W * 2) / 3, y: H / 3 },
        { x: W / 3, y: (H * 2) / 3 }, { x: (W * 2) / 3, y: (H * 2) / 3 }
      ];

      let targetPt = targets[0], minDist = Infinity;
      targets.forEach(pt => {
        const d = Math.hypot(pt.x - center.x, pt.y - center.y);
        if (d < minDist) { minDist = d; targetPt = pt; }
      });

      const alignThreshold = Math.min(W, H) * 0.085;
      const isAligned = minDist <= alignThreshold;

      ctx.save();
      ctx.beginPath();
      ctx.arc(targetPt.x, targetPt.y, alignThreshold, 0, Math.PI * 2);

      if (isAligned) {
        ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = 'rgba(34, 197, 94, 0.25)'; ctx.fill();
        updateHUD('✨', isAutoShoot ? '완벽한 구도! 자동 촬영 중...' : '완벽한 구도! 셔터를 누르세요', '#22c55e');

        if (!isLocked) {
          isLocked = true;
          if (navigator.vibrate) navigator.vibrate(50);
          if (isAutoShoot) {
            clearTimeout(lockTimer);
            lockTimer = setTimeout(capturePhoto, 800);
          }
        }
      } else {
        isLocked = false;
        clearTimeout(lockTimer);
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]); ctx.stroke();
        drawArrow(center, targetPt);

        const dx = targetPt.x - center.x, dy = targetPt.y - center.y;
        generateDirectionInstruction(dx, dy);
      }
      ctx.restore();
    }

    function generateDirectionInstruction(dx, dy) {
      let h = Math.abs(dx) > 30 ? (dx > 0 ? '오른쪽' : '왼쪽') : '';
      let v = Math.abs(dy) > 30 ? (dy > 0 ? '아래' : '위') : '';
      let arrow = (dx > 0 && dy > 0) ? '↘' : (dx > 0 && dy < 0) ? '↗' : (dx < 0 && dy > 0) ? '↙' : '↖';
      if (h && v) updateHUD(arrow, `카메라를 ${h} ${v}로 이동하세요`, '#0284c7');
      else if (h) updateHUD(dx > 0 ? '➔' : '⬅', `카메라를 ${h}으로 이동하세요`, '#0284c7');
      else if (v) updateHUD(dy > 0 ? '⬇' : '⬆', `카메라를 ${v}로 이동하세요`, '#0284c7');
      else updateHUD('🎯', '조금만 더 원 중심에 맞춰보세요', '#0284c7');
    }

    function drawArrow(from, to) {
      ctx.save(); ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
      const angle = Math.atan2(to.y - from.y, to.x - from.x), len = 14;
      ctx.beginPath(); ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - len * Math.cos(angle - Math.PI / 6), to.y - len * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - len * Math.cos(angle + Math.PI / 6), to.y - len * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = '#38bdf8'; ctx.fill(); ctx.restore();
    }

    function drawBox(box, color, label) {
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.w, box.h);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(box.x, Math.max(0, box.y - 24), ctx.measureText(label).width + 16, 22);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, box.x + 8, Math.max(16, box.y - 8));
      ctx.restore();
    }

    function drawGrid() {
      const W = overlay.width, H = overlay.height;
      ctx.save(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 3, 0); ctx.lineTo(W / 3, H); ctx.moveTo((W * 2) / 3, 0); ctx.lineTo((W * 2) / 3, H);
      ctx.moveTo(0, H / 3); ctx.lineTo(W, H / 3); ctx.moveTo(0, (H * 2) / 3); ctx.lineTo(W, (H * 2) / 3);
      ctx.stroke(); ctx.restore();
    }

    function updateHUD(icon, text, bg) {
      hudIcon.innerText = icon; hudText.innerText = text;
      if (bg) hudBar.style.background = bg;
    }

    function capturePhoto() {
      flashOverlay.classList.remove('flash-anim'); void flashOverlay.offsetWidth; flashOverlay.classList.add('flash-anim');
      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = video.videoWidth; captureCanvas.height = video.videoHeight;
      const cCtx = captureCanvas.getContext('2d');
      cCtx.filter = 'contrast(1.1) saturate(1.15)';
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

      captureCanvas.toBlob(blob => {
        capturedBlob = blob;
        previewImg.src = URL.createObjectURL(blob);
        previewModal.style.display = 'flex';
      }, 'image/jpeg', 0.95);
    }

    shutterBtn.addEventListener('click', capturePhoto);
    autoBtn.addEventListener('click', () => {
      isAutoShoot = !isAutoShoot; autoBtn.classList.toggle('active', isAutoShoot);
      document.getElementById('auto-text').innerHTML = isAutoShoot ? 'AUTO<br>ON' : 'AUTO<br>OFF';
    });
    flipBtn.addEventListener('click', async () => {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment'; await setupCamera();
    });
    btnRetake.addEventListener('click', () => {
      previewModal.style.display = 'none'; capturedBlob = null; isLocked = false;
    });
    btnSave.addEventListener('click', () => {
      if (!capturedBlob) return;
      const fileName = `smart_photo_${Date.now()}.jpg`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(capturedBlob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      previewModal.style.display = 'none';
      resetSelection();
    });

    setupCamera().then(() => {
      initFaceDetector();
      renderLoop();
    });
  </script>
</body>
</html>
