<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Composition Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
    }

    /* 상단 안내 바 */
    #hud-bar {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      z-index: 25;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    /* 하단 셔터 및 컨트롤 */
    #controls {
      position: absolute;
      bottom: 35px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
      padding: 0 40px;
    }
    .sub-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #shutter-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #shutter-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    #shutter-btn:active #shutter-inner {
      transform: scale(0.88);
    }

    /* 베스트 샷 준비 완료 시 셔터 발광 */
    #shutter-btn.ready {
      border-color: #22c55e;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.85);
      transform: scale(1.06);
    }
    #shutter-btn.ready #shutter-inner {
      background: #22c55e;
    }

    /* 플래시 애니메이션 */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
    }
    .flash-anim { animation: flash 0.25s ease-out; }
    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* 결과 미리보기 모달 */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 40px;
    }
    #preview-img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      object-fit: contain;
    }
    .modal-actions {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }
    .action-btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #btn-retake { background: #27272a; color: #fff; }
    #btn-save { background: #22c55e; color: #fff; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash-overlay"></div>

    <div id="hud-bar">
      <span id="hud-icon">🎯</span>
      <span id="hud-text">노란 점을 중앙 원 안으로 넣으세요</span>
    </div>

    <div id="controls">
      <div style="width: 50px;"></div>
      <div id="shutter-btn"><div id="shutter-inner"></div></div>
      <button class="sub-btn" id="flip-btn">전환</button>
    </div>
  </div>

  <div id="preview-modal">
    <div style="color: #4ade80; font-size: 14px; font-weight: 700; margin-top: 10px;">✨ 베스트 앵글 촬영 완료</div>
    <img id="preview-img" alt="촬영된 사진">
    <div class="modal-actions">
      <button class="action-btn" id="btn-retake">다시 찍기</button>
      <button class="action-btn" id="btn-save">저장하기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const hudBar = document.getElementById('hud-bar');
    const hudIcon = document.getElementById('hud-icon');
    const hudText = document.getElementById('hud-text');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipBtn = document.getElementById('flip-btn');
    const flashOverlay = document.getElementById('flash-overlay');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const btnRetake = document.getElementById('btn-retake');
    const btnSave = document.getElementById('btn-save');

    let currentStream = null;
    let facingMode = 'environment';
    let capturedBlob = null;

    // 자이로 각도 변수
    let tiltRoll = 0;   // 좌우 회전 (gamma)
    let tiltPitch = 0;  // 상하 기울기 (beta)
    let smoothRoll = 0;
    let smoothPitch = 0;

    let isAligned = false;
    let wasAligned = false;

    // 1. 카메라 시작
    async function setupCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = {
        video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          resolve();
        };
      });
    }

    function resizeCanvas() {
      overlay.width = video.videoWidth || window.innerWidth;
      overlay.height = video.videoHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 2. 센서 연동 (부드러운 볼 움직임)
    function initSensors() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.gamma !== null && e.beta !== null) {
            tiltRoll = e.gamma;                // 좌우 롤
            tiltPitch = e.beta - 70;           // 폰을 대각선/직립으로 들 때의 기본 각도(약 70도) 기준
          }
        });
      }
    }

    // 3. 메인 렌더링 루프
    function render() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      const W = overlay.width;
      const H = overlay.height;

      // 은은한 3분할 가이드 격자 (방해되지 않는 얇은 선)
      drawSimpleGrid(W, H);

      // 센서 값 선형 보간 (튀지 않고 부드럽게 감속)
      smoothRoll += (tiltRoll - smoothRoll) * 0.15;
      smoothPitch += (tiltPitch - smoothPitch) * 0.15;

      // 중앙 타깃 링 좌표 (화면 중심에서 약간 위쪽, 사진이 가장 예쁜 45% 지점)
      const targetX = W / 2;
      const targetY = H * 0.46;
      const targetRadius = Math.min(W, H) * 0.085; // 도킹 링 크기

      // 스마트폰 기울기에 따라 이동하는 '밸런스 볼' 좌표
      const ballOffsetScale = Math.min(W, H) * 0.015;
      const ballX = targetX + Math.max(-W * 0.35, Math.min(W * 0.35, smoothRoll * ballOffsetScale));
      const ballY = targetY + Math.max(-H * 0.3, Math.min(H * 0.3, smoothPitch * ballOffsetScale));

      // 거리 및 수평 검사
      const dist = Math.hypot(targetX - ballX, targetY - ballY);
      const isLevel = Math.abs(smoothRoll) < 3.5; // 현실적인 수평 오차 (3.5도)
      isAligned = (dist < targetRadius * 0.65) && isLevel;

      // (1) 중앙 고정 타깃 링 그리기
      ctx.save();
      ctx.beginPath();
      ctx.arc(targetX, targetY, targetRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isAligned ? '#22c55e' : 'rgba(255, 255, 255, 0.65)';
      ctx.lineWidth = isAligned ? 4.5 : 2;
      if (!isAligned) ctx.setLineDash([6, 6]);
      ctx.stroke();

      if (isAligned) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.25)';
        ctx.fill();
      }
      ctx.restore();

      // (2) 유동 밸런스 볼 그리기
      ctx.save();
      ctx.beginPath();
      ctx.arc(ballX, ballY, 12, 0, Math.PI * 2);
      ctx.fillStyle = isAligned ? '#22c55e' : '#ffd700';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 8;
      ctx.fill();

      // 타깃과 볼을 연결하는 미세 유도선
      if (!isAligned) {
        ctx.beginPath();
        ctx.moveTo(targetX, targetY);
        ctx.lineTo(ballX, ballY);
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();

      // (3) 상태 텍스트 & 셔터 피드백
      if (isAligned) {
        if (!wasAligned) {
          if (navigator.vibrate) navigator.vibrate(40); // 정렬 성공 시 기분 좋은 햅틱
          wasAligned = true;
        }
        updateHUD('✨', '베스트 앵글! 지금 셔터를 누르세요', '#22c55e');
        shutterBtn.classList.add('ready');
      } else {
        wasAligned = false;
        shutterBtn.classList.remove('ready');

        if (Math.abs(smoothRoll) >= 4.0 && dist < targetRadius * 1.5) {
          updateHUD('📐', '수평을 살짝만 맞춰주세요', '#f59e0b');
        } else {
          updateHUD('🎯', '노란 점을 중앙 원 안으로 넣으세요', 'rgba(15, 23, 42, 0.85)');
        }
      }

      requestAnimationFrame(render);
    }

    function drawSimpleGrid(W, H) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 3, 0); ctx.lineTo(W / 3, H);
      ctx.moveTo((W * 2) / 3, 0); ctx.lineTo((W * 2) / 3, H);
      ctx.moveTo(0, H / 3); ctx.lineTo(W, H / 3);
      ctx.moveTo(0, (H * 2) / 3); ctx.lineTo(W, (H * 2) / 3);
      ctx.stroke();
      ctx.restore();
    }

    function updateHUD(icon, text, bg) {
      hudIcon.innerText = icon;
      hudText.innerText = text;
      hudBar.style.background = bg;
    }

    // 4. 촬영 및 저장
    function capturePhoto() {
      flashOverlay.classList.remove('flash-anim');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-anim');
      if (navigator.vibrate) navigator.vibrate(60);

      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      const cCtx = captureCanvas.getContext('2d');

      // AI 카메라 색감 보정
      cCtx.filter = 'contrast(1.08) saturate(1.12)';
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

      captureCanvas.toBlob(blob => {
        capturedBlob = blob;
        previewImg.src = URL.createObjectURL(blob);
        previewModal.style.display = 'flex';
      }, 'image/jpeg', 0.95);
    }

    shutterBtn.addEventListener('click', capturePhoto);

    flipBtn.addEventListener('click', async () => {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      await setupCamera();
    });

    btnRetake.addEventListener('click', () => {
      previewModal.style.display = 'none';
      capturedBlob = null;
    });

    btnSave.addEventListener('click', () => {
      if (!capturedBlob) return;
      const fileName = `best_shot_${Date.now()}.jpg`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(capturedBlob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      previewModal.style.display = 'none';
    });

    setupCamera().then(() => {
      initSensors();
      render();
    });
  </script>
</body>
</html>
