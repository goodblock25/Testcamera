<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Photo Director Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
    }

    /* 상단 포토 디렉터 코칭 HUD */
    #director-hud {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 25;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #hud-step-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #3b82f6;
      color: #fff;
      text-transform: uppercase;
    }
    #hud-command {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      text-align: center;
      white-space: pre-line;
      line-height: 1.35;
    }
    #hud-command-icon {
      font-size: 20px;
    }

    /* 포커스 초기화 버튼 */
    #reset-focus-btn {
      position: absolute;
      top: 118px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 16px;
      z-index: 25;
      display: none;
      cursor: pointer;
    }

    /* 하단 셔터 및 컨트롤 바 */
    #controls {
      position: absolute;
      bottom: 35px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
      padding: 0 40px;
    }
    .sub-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #shutter-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    #shutter-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    #shutter-btn:active #shutter-inner {
      transform: scale(0.88);
    }

    /* 베스트 샷 도달 시 셔터 반응 */
    #shutter-btn.perfect-shot {
      border-color: #22c55e;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.85);
      transform: scale(1.08);
    }
    #shutter-btn.perfect-shot #shutter-inner {
      background: #22c55e;
    }

    /* 플래시 애니메이션 */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
    }
    .flash-anim { animation: flash 0.25s ease-out; }
    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* 결과 미리보기 모달 */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 40px;
    }
    #preview-img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 16px;
      object-fit: contain;
    }
    .modal-actions {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }
    .action-btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #btn-retake { background: #27272a; color: #fff; }
    #btn-save { background: #22c55e; color: #fff; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash-overlay"></div>

    <!-- 포토 디렉터 코칭 HUD -->
    <div id="director-hud">
      <span id="hud-step-badge">DIRECTOR GUIDE</span>
      <div id="hud-command">
        <span id="hud-command-icon">👆</span>
        <span id="hud-command-text">촬영할 피사체를 화면에서 터치하세요</span>
      </div>
    </div>

    <button id="reset-focus-btn">다른 피사체 선택 ✕</button>

    <div id="controls">
      <div style="width: 50px;"></div>
      <div id="shutter-btn"><div id="shutter-inner"></div></div>
      <button class="sub-btn" id="flip-btn">전환</button>
    </div>
  </div>

  <div id="preview-modal">
    <div style="color: #4ade80; font-size: 14px; font-weight: 700; margin-top: 10px;">✨ 디렉터 추천 구도 촬영 완료</div>
    <img id="preview-img" alt="촬영된 사진">
    <div class="modal-actions">
      <button class="action-btn" id="btn-retake">다시 찍기</button>
      <button class="action-btn" id="btn-save">저장하기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const directorHud = document.getElementById('director-hud');
    const hudStepBadge = document.getElementById('hud-step-badge');
    const hudCommandIcon = document.getElementById('hud-command-icon');
    const hudCommandText = document.getElementById('hud-command-text');
    const resetFocusBtn = document.getElementById('reset-focus-btn');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipBtn = document.getElementById('flip-btn');
    const flashOverlay = document.getElementById('flash-overlay');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const btnRetake = document.getElementById('btn-retake');
    const btnSave = document.getElementById('btn-save');

    let currentStream = null;
    let facingMode = 'environment';
    let capturedBlob = null;

    // 수평 센서
    let tiltAngle = 0;
    let smoothTilt = 0;
    let isLevel = false;

    // 피사체 및 목표 프레임 데이터
    let hasTarget = false;
    let subjectAnchor = null;   // 사용자가 탭한 피사체 실제 위치
    let idealFrame = null;      // 작가가 권장하는 화면 내 최적 배치 위치
    let lastBeta = null, lastGamma = null;

    // 1. 카메라 스트림 시작
    async function setupCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = {
        video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          resolve();
        };
      });
    }

    function resizeCanvas() {
      overlay.width = video.videoWidth || window.innerWidth;
      overlay.height = video.videoHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 2. 스마트폰 모션 센서 연동 (촬영자가 움직일 때 앵커 위치 역보정)
    function initSensors() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.gamma !== null && e.beta !== null) {
            tiltAngle = e.gamma;
            smoothTilt += (tiltAngle - smoothTilt) * 0.2;
            isLevel = Math.abs(smoothTilt) < 3.2;

            if (hasTarget && subjectAnchor && lastBeta !== null && lastGamma !== null) {
              const deltaX = (e.gamma - lastGamma) * 14;
              const deltaY = (e.beta - lastBeta) * 14;
              // 촬영자가 카메라를 돌리면 피사체 위치가 프레임 안에서 반대로 이동
              subjectAnchor.x -= deltaX;
              subjectAnchor.y -= deltaY;

              subjectAnchor.x = Math.max(-100, Math.min(overlay.width + 100, subjectAnchor.x));
              subjectAnchor.y = Math.max(-100, Math.min(overlay.height + 100, subjectAnchor.y));
            }
            lastBeta = e.beta;
            lastGamma = e.gamma;
          }
        });
      }
    }

    // 3. 피사체 터치: 포토 디렉터의 이상적 구도(Ideal Composition) 연산
    overlay.addEventListener('pointerdown', (e) => {
      const rect = overlay.getBoundingClientRect();
      const scaleX = overlay.width / rect.width;
      const scaleY = overlay.height / rect.height;
      const touchX = (e.clientX - rect.left) * scaleX;
      const touchY = (e.clientY - rect.top) * scaleY;

      subjectAnchor = { x: touchX, y: touchY };
      hasTarget = true;
      resetFocusBtn.style.display = 'block';

      // 디렉터가 이 피사체를 어디로 가져와야 할지 황금 프레임 지정
      calculateIdealComposition(touchX, touchY);

      if (navigator.vibrate) navigator.vibrate(40);
    });

    resetFocusBtn.addEventListener('click', () => {
      hasTarget = false;
      subjectAnchor = null;
      idealFrame = null;
      resetFocusBtn.style.display = 'none';
      shutterBtn.classList.remove('perfect-shot');
      updateHUD('DIRECTOR STANDBY', '👆', '촬영할 피사체를 화면에서 터치하세요', '#3b82f6', 'rgba(15, 23, 42, 0.92)');
    });

    // 4. 사진학적 황금 구도 목표 위치 결정
    function calculateIdealComposition(touchX, touchY) {
      const W = overlay.width;
      const H = overlay.height;

      // 피사체가 화면 좌측에 치우쳐 있으면 좌측 1/3 황금선에 배치하고 우측에 여백 부여
      // 피사체가 화면 우측에 치우쳐 있으면 우측 1/3 황금선에 배치하고 좌측에 여백 부여
      // 화면 중앙부(40~60%)라면 정중앙 집중 구도 지정
      let targetX = W / 2;
      let targetY = H * 0.45; // 시각적 중심

      if (touchX < W * 0.42) {
        targetX = W / 3;        // 좌측 3분할 교차점
      } else if (touchX > W * 0.58) {
        targetX = (W * 2) / 3;  // 우측 3분할 교차점
      }

      idealFrame = {
        x: targetX,
        y: targetY,
        radius: Math.min(W, H) * 0.11 // 권장 도킹 반경
      };
    }

    // 5. 메인 렌더링 & 촬영자 디렉팅 루프
    function renderLoop() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      const W = overlay.width;
      const H = overlay.height;

      // 미세 3분할 격자
      drawGrid(W, H);

      // 미니 수평 가이드
      drawMiniLevel(W, H);

      if (!hasTarget || !subjectAnchor) {
        // 대기 상태
        shutterBtn.classList.remove('perfect-shot');
      } else {
        // 촬영자에게 구체적인 움직임 코칭 실행
        directPhotographer(W, H);
      }

      requestAnimationFrame(renderLoop);
    }

    // 6. 촬영자 행동 유도 코칭 엔진
    function directPhotographer(W, H) {
      const dx = idealFrame.x - subjectAnchor.x;
      const dy = idealFrame.y - subjectAnchor.y;
      const distance = Math.hypot(dx, dy);

      const isPositionMatched = distance <= idealFrame.radius * 0.7;
      const isCompletelyReady = isPositionMatched && isLevel;

      // (1) 작가의 황금 타깃 프레임 렌더링
      ctx.save();
      ctx.beginPath();
      ctx.arc(idealFrame.x, idealFrame.y, idealFrame.radius, 0, Math.PI * 2);
      ctx.strokeStyle = isCompletelyReady ? '#22c55e' : 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = isCompletelyReady ? 4 : 2;
      if (!isCompletelyReady) ctx.setLineDash([8, 6]);
      ctx.stroke();

      if (isCompletelyReady) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.25)';
        ctx.fill();
      }
      ctx.restore();

      // (2) 피사체 핀 렌더링
      ctx.save();
      ctx.beginPath();
      ctx.arc(subjectAnchor.x, subjectAnchor.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = isCompletelyReady ? '#22c55e' : '#ffd700';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 8;
      ctx.fill();

      // (3) 이동 안내 다이나믹 화살표 렌더링
      if (!isPositionMatched) {
        drawGuideArrow(subjectAnchor, idealFrame);
      }
      ctx.restore();

      // (4) 촬영자에게 직접적인 행동 명령 하달
      if (isCompletelyReady) {
        // [완벽]
        updateHUD('PERFECT ANGLE', '✨', '구도가 완벽합니다!\n지금 셔터를 누르세요!', '#22c55e', 'rgba(22, 101, 52, 0.95)');
        shutterBtn.classList.add('perfect-shot');
      } 
      else if (isPositionMatched && !isLevel) {
        // [위치는 맞았으나 수평이 기운 상태]
        updateHUD('STEP 2: 수평 맞추기', '📐', '스마트폰을 똑바로 세워\n수평을 맞춰주세요', '#f59e0b', 'rgba(120, 53, 15, 0.92)');
        shutterBtn.classList.remove('perfect-shot');
      } 
      else {
        // [촬영자가 카메라를 움직여 프레임을 재배치해야 하는 상태]
        shutterBtn.classList.remove('perfect-shot');
        generatePhotographerMovementDirective(dx, dy);
      }
    }

    // 촬영자에게 명확한 방향 지시 생성 ("카메라를 오른쪽으로 돌리세요" 등)
    function generatePhotographerMovementDirective(dx, dy) {
      let horizontalDirective = '';
      let verticalDirective = '';
      let arrow = '';

      // dx > 0 : 피사체가 타깃보다 왼쪽에 있음 -> 카메라를 왼쪽으로 돌려야 피사체가 오른쪽(타깃)으로 옴
      // dx < 0 : 피사체가 타깃보다 오른쪽에 있음 -> 카메라를 오른쪽으로 돌려야 피사체가 왼쪽(타깃)으로 옴
      if (Math.abs(dx) > 35) {
        horizontalDirective = dx > 0 ? '카메라를 왼쪽으로 회전' : '카메라를 오른쪽으로 회전';
      }
      if (Math.abs(dy) > 35) {
        verticalDirective = dy > 0 ? '카메라를 위로 올림' : '카메라를 아래로 숙임';
      }

      if (horizontalDirective && verticalDirective) {
        arrow = (dx > 0 && dy > 0) ? '↖' : (dx > 0 && dy < 0) ? '↙' : (dx < 0 && dy > 0) ? '↗' : '↘';
        updateHUD('STEP 1: 앵글 이동', arrow, `${horizontalDirective}하며\n${verticalDirective}하여 피사체를 원에 맞추세요`, '#38bdf8', 'rgba(15, 23, 42, 0.92)');
      } else if (horizontalDirective) {
        arrow = dx > 0 ? '⬅' : '➔';
        updateHUD('STEP 1: 패닝 이동', arrow, `${horizontalDirective}하여\n피사체를 황금선 위치로 옮기세요`, '#38bdf8', 'rgba(15, 23, 42, 0.92)');
      } else if (verticalDirective) {
        arrow = dy > 0 ? '⬆' : '⬇';
        updateHUD('STEP 1: 틸트 조절', arrow, `${verticalDirective}하여\n화면 여백을 안정적으로 맞추세요`, '#38bdf8', 'rgba(15, 23, 42, 0.92)');
      } else {
        updateHUD('STEP 1: 미세 조정', '🎯', '조금만 더 원 중심 쪽으로\n카메라 각도를 미세 조정하세요', '#38bdf8', 'rgba(15, 23, 42, 0.92)');
      }
    }

    function drawGuideArrow(from, to) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const len = 15;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - len * Math.cos(angle - Math.PI / 6), to.y - len * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - len * Math.cos(angle + Math.PI / 6), to.y - len * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
      ctx.restore();
    }

    function drawMiniLevel(W, H) {
      const cy = H * 0.88; // 화면 하단 수평계
      const len = 40;
      const rad = (smoothTilt * Math.PI) / 180;

      ctx.save();
      ctx.translate(W / 2, cy);
      ctx.rotate(-rad);
      ctx.beginPath();
      ctx.moveTo(-len, 0); ctx.lineTo(len, 0);
      ctx.strokeStyle = isLevel ? '#22c55e' : 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = isLevel ? 3 : 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function drawGrid(W, H) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 3, 0); ctx.lineTo(W / 3, H);
      ctx.moveTo((W * 2) / 3, 0); ctx.lineTo((W * 2) / 3, H);
      ctx.moveTo(0, H / 3); ctx.lineTo(W, H / 3);
      ctx.moveTo(0, (H * 2) / 3); ctx.lineTo(W, (H * 2) / 3);
      ctx.stroke();
      ctx.restore();
    }

    function updateHUD(badge, icon, text, badgeBg, hudBg) {
      hudStepBadge.innerText = badge;
      if (badgeBg) hudStepBadge.style.background = badgeBg;
      hudCommandIcon.innerText = icon;
      hudCommandText.innerText = text;
      if (hudBg) directorHud.style.background = hudBg;
    }

    // 7. 촬영 및 저장
    function capturePhoto() {
      flashOverlay.classList.remove('flash-anim');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-anim');
      if (navigator.vibrate) navigator.vibrate(60);

      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      const cCtx = captureCanvas.getContext('2d');

      // AI 카메라 색감 보정
      cCtx.filter = 'contrast(1.08) saturate(1.12)';
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

      captureCanvas.toBlob(blob => {
        capturedBlob = blob;
        previewImg.src = URL.createObjectURL(blob);
        previewModal.style.display = 'flex';
      }, 'image/jpeg', 0.95);
    }

    shutterBtn.addEventListener('click', capturePhoto);

    flipBtn.addEventListener('click', async () => {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      await setupCamera();
    });

    btnRetake.addEventListener('click', () => {
      previewModal.style.display = 'none';
      capturedBlob = null;
    });

    btnSave.addEventListener('click', () => {
      if (!capturedBlob) return;
      const fileName = `director_shot_${Date.now()}.jpg`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(capturedBlob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      previewModal.style.display = 'none';
    });

    setupCamera().then(() => {
      initSensors();
      renderLoop();
    });
  </script>
</body>
