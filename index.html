<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Smart Guide Camera</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
    }

    /* 상단 내비게이션 HUD */
    #hud-bar {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #hud-icon {
      font-size: 18px;
    }

    /* 피사체 선택 확인 팝업 (하단 시트 형태) */
    #confirm-dialog {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: 88%;
      max-width: 360px;
      background: rgba(18, 18, 20, 0.92);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 215, 0, 0.5);
      border-radius: 20px;
      padding: 18px 20px;
      z-index: 30;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }
    #confirm-dialog.show {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .dialog-title {
      color: #ffd700;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .dialog-desc {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .dialog-btns {
      display: flex;
      gap: 10px;
    }
    .dialog-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #btn-guide-start { background: #3b82f6; color: #fff; }
    #btn-guide-cancel { background: #334155; color: #94a3b8; }

    /* 가이드 중지 버튼 (상단 우측) */
    #stop-guide-btn {
      position: absolute;
      top: 45px;
      right: 18px;
      background: rgba(239, 68, 68, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
      z-index: 25;
      display: none;
      cursor: pointer;
    }

    /* 하단 셔터 및 컨트롤 바 */
    #controls {
      position: absolute;
      bottom: 35px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
      padding: 0 25px;
    }
    .btn-circle {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn-sub {
      width: 52px;
      height: 52px;
      font-size: 11px;
      font-weight: 700;
    }
    .btn-sub.active {
      background: #22c55e;
      border-color: #4ade80;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    #shutter-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 50%;
      transition: transform 0.1s ease;
    }
    #shutter-btn:active #shutter-inner {
      transform: scale(0.88);
    }

    /* 결과 미리보기 모달 */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 40px;
    }
    #preview-img {
      max-width: 100%;
      max-height: 72vh;
      border-radius: 16px;
      object-fit: contain;
    }
    .modal-actions {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }
    .action-btn {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #btn-retake { background: #27272a; color: #fff; }
    #btn-save { background: #22c55e; color: #fff; }

    /* 화면 깜빡임 플래시 효과 */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
    }
    .flash-anim {
      animation: flash 0.3s ease-out;
    }
    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash-overlay"></div>

    <!-- 상단 가이드 안내 HUD -->
    <div id="hud-bar">
      <span id="hud-icon">👆</span>
      <span id="hud-text">화면에서 촬영할 피사체를 터치하세요</span>
    </div>

    <!-- 가이드 취소/중지 버튼 -->
    <button id="stop-guide-btn">가이드 종료 ✕</button>

    <!-- 피사체 선택 확인 팝업 -->
    <div id="confirm-dialog">
      <div class="dialog-title">이 피사체로 가이드를 시작할까요?</div>
      <div class="dialog-desc">선택한 피사체가 화면에서 사라지기 전까지<br>최적의 황금비율 구도를 실시간으로 안내합니다.</div>
      <div class="dialog-btns">
        <button class="dialog-btn" id="btn-guide-cancel">취소</button>
        <button class="dialog-btn" id="btn-guide-start">가이드 시작</button>
      </div>
    </div>

    <!-- 하단 셔터 및 컨트롤 바 -->
    <div id="controls">
      <button class="btn-circle btn-sub" id="auto-btn">
        <span id="auto-text">AUTO<br>OFF</span>
      </button>
      <div id="shutter-btn"><div id="shutter-inner"></div></div>
      <button class="btn-circle btn-sub" id="flip-btn">전환</button>
    </div>
  </div>

  <!-- 결과 미리보기 모달 -->
  <div id="preview-modal">
    <div style="color: #4ade80; font-size: 14px; font-weight: 700; margin-top: 10px;">✨ AI 최적 구도 촬영 완료</div>
    <img id="preview-img" alt="촬영된 사진">
    <div class="modal-actions">
      <button class="action-btn" id="btn-retake">다시 찍기</button>
      <button class="action-btn" id="btn-save">저장하기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const hudBar = document.getElementById('hud-bar');
    const hudIcon = document.getElementById('hud-icon');
    const hudText = document.getElementById('hud-text');
    const confirmDialog = document.getElementById('confirm-dialog');
    const btnGuideStart = document.getElementById('btn-guide-start');
    const btnGuideCancel = document.getElementById('btn-guide-cancel');
    const stopGuideBtn = document.getElementById('stop-guide-btn');
    const autoBtn = document.getElementById('auto-btn');
    const shutterBtn = document.getElementById('shutter-btn');
    const flipBtn = document.getElementById('flip-btn');
    const flashOverlay = document.getElementById('flash-overlay');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const btnRetake = document.getElementById('btn-retake');
    const btnSave = document.getElementById('btn-save');

    // 앱 상태 모드: 'IDLE' | 'PENDING' | 'GUIDING'
    let appMode = 'IDLE';
    let isAutoShoot = false;
    let facingMode = 'environment';
    let currentStream = null;
    let capturedBlob = null;
    let lockTimer = null;
    let isLocked = false;

    // 피사체 데이터
    let candidatePoint = null; // 터치한 좌표
    let trackedBox = { x: 0, y: 0, w: 140, h: 140 };
    let patchTemplate = null; // 템플릿 패치 데이터
    let patchSize = 24;
    let lostFrameCounter = 0;

    // 오프스크린 캔버스 (경량 트래커용)
    const trackCanvas = document.createElement('canvas');
    const trackCtx = trackCanvas.getContext('2d', { willReadFrequently: true });
    trackCanvas.width = 120;
    trackCanvas.height = 120;

    // 1. 카메라 시작
    async function setupCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvas();
          resolve();
        };
      });
    }

    function resizeCanvas() {
      overlay.width = video.videoWidth || window.innerWidth;
      overlay.height = video.videoHeight || window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 2. 화면 터치 및 좌표 계산
    overlay.addEventListener('pointerdown', (e) => {
      if (appMode === 'GUIDING') return; // 이미 가이드 중일 때는 터치 무시

      const rect = overlay.getBoundingClientRect();
      const scaleX = overlay.width / rect.width;
      const scaleY = overlay.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      // 피사체 후보 설정
      const defaultSize = Math.min(overlay.width, overlay.height) * 0.22;
      trackedBox = {
        x: x - defaultSize / 2,
        y: y - defaultSize / 2,
        w: defaultSize,
        h: defaultSize
      };
      candidatePoint = { x, y };

      // 상태 전환 및 확인 다이얼로그 표시
      appMode = 'PENDING';
      confirmDialog.classList.add('show');
      updateHUD('🔍', '이 피사체로 가이드를 시작할까요?', '#facc15');
    });

    // 가이드 시작 버튼 클릭
    btnGuideStart.addEventListener('click', () => {
      appMode = 'GUIDING';
      confirmDialog.classList.remove('show');
      stopGuideBtn.style.display = 'block';

      // 터치 지점의 패치 템플릿 추출 (어떤 사물이든 트래킹하기 위함)
      capturePatchTemplate();
      lostFrameCounter = 0;
      updateHUD('🎯', '피사체를 타깃 원으로 유도하세요', '#38bdf8');
    });

    // 취소 버튼
    btnGuideCancel.addEventListener('click', resetToIdle);
    stopGuideBtn.addEventListener('click', resetToIdle);

    function resetToIdle() {
      appMode = 'IDLE';
      confirmDialog.classList.remove('show');
      stopGuideBtn.style.display = 'none';
      candidatePoint = null;
      patchTemplate = null;
      isLocked = false;
      clearTimeout(lockTimer);
      updateHUD('👆', '화면에서 촬영할 피사체를 터치하세요', 'rgba(15, 23, 42, 0.85)');
    }

    // 3. 트래킹 패치 추출 (24x24 Grayscale)
    function capturePatchTemplate() {
      const cx = trackedBox.x + trackedBox.w / 2;
      const cy = trackedBox.y + trackedBox.h / 2;
      trackCtx.drawImage(video, cx - 12, cy - 12, 24, 24, 0, 0, 24, 24);
      const imgData = trackCtx.getImageData(0, 0, 24, 24);
      patchTemplate = new Float32Array(24 * 24);
      for (let i = 0; i < imgData.data.length; i += 4) {
        // 밝기(Grayscale) 계산
        patchTemplate[i / 4] = 0.299 * imgData.data[i] + 0.587 * imgData.data[i+1] + 0.114 * imgData.data[i+2];
      }
    }

    // 4. 메인 렌더링 및 가이드 루프
    function processLoop() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      drawGrid();

      if (appMode === 'PENDING') {
        // 선택 대기 상태: 터치한 위치에 노란색 포커스 링 표시
        drawTargetBox(trackedBox, '#ffd700', '선택 대기');
      } 
      else if (appMode === 'GUIDING') {
        // 가이드 진행 상태: 피사체 추적 및 구도 안내
        trackSubject();
      }

      requestAnimationFrame(processLoop);
    }

    // 피사체 추적 및 이탈 검사
    function trackSubject() {
      const W = overlay.width;
      const H = overlay.height;
      const cx = trackedBox.x + trackedBox.w / 2;
      const cy = trackedBox.y + trackedBox.h / 2;

      // 1. 화면 밖으로 완전히 벗어났는지 검사
      if (cx < -50 || cx > W + 50 || cy < -50 || cy > H + 50) {
        lostFrameCounter++;
        if (lostFrameCounter > 25) {
          triggerObjectLost();
          return;
        }
      }

      // 2. 경량 패치 매칭 (주변 탐색)
      if (patchTemplate) {
        const searchSize = 80;
        trackCtx.drawImage(
          video,
          cx - searchSize / 2, cy - searchSize / 2, searchSize, searchSize,
          0, 0, 80, 80
        );
        const searchData = trackCtx.getImageData(0, 0, 80, 80);

        let bestSAD = Infinity;
        let bestDx = 0;
        let bestDy = 0;

        // 서치 윈도우 스캔 (2픽셀 스텝으로 고속 연산)
        for (let y = 0; y <= searchSize - patchSize; y += 3) {
          for (let x = 0; x <= searchSize - patchSize; x += 3) {
            let sad = 0;
            for (let py = 0; py < patchSize; py += 2) {
              for (let px = 0; px < patchSize; px += 2) {
                const sIdx = ((y + py) * 80 + (x + px)) * 4;
                const gray = 0.299 * searchData.data[sIdx] + 0.587 * searchData.data[sIdx+1] + 0.114 * searchData.data[sIdx+2];
                sad += Math.abs(gray - patchTemplate[py * patchSize + px]);
              }
            }
            if (sad < bestSAD) {
              bestSAD = sad;
              bestDx = x - (searchSize - patchSize) / 2;
              bestDy = y - (searchSize - patchSize) / 2;
            }
          }
        }

        // 매칭 임계치 검사 (너무 다르면 피사체가 가려졌거나 이탈한 것)
        const avgDiff = bestSAD / (12 * 12);
        if (avgDiff > 75) {
          lostFrameCounter++;
          if (lostFrameCounter > 40) {
            triggerObjectLost();
            return;
          }
        } else {
          lostFrameCounter = 0;
          // 부드러운 위치 갱신 (Lerp)
          trackedBox.x += bestDx * 0.35;
          trackedBox.y += bestDy * 0.35;
        }
      }

      // 피사체 테두리 렌더링
      drawTargetBox(trackedBox, '#38bdf8', '추적 중인 피사체');

      // 3. 최적 구도 계산 및 화살표 가이드
      guideToOptimalRuleOfThirds();
    }

    // 피사체 화면 이탈 알림
    function triggerObjectLost() {
      updateHUD('⚠️', '피사체가 화면을 벗어났습니다', '#ef4444');
      if (navigator.vibrate) navigator.vibrate(200);
      setTimeout(resetToIdle, 1800);
    }

    // 5. 황금비율(3분할) 내비게이션 엔진
    function guideToOptimalRuleOfThirds() {
      const W = overlay.width;
      const H = overlay.height;

      // 3분할의 4대 교차점
      const rulePoints = [
        { x: W / 3, y: H / 3 },
        { x: (W * 2) / 3, y: H / 3 },
        { x: W / 3, y: (H * 2) / 3 },
        { x: (W * 2) / 3, y: (H * 2) / 3 }
      ];

      const curCenter = {
        x: trackedBox.x + trackedBox.w / 2,
        y: trackedBox.y + trackedBox.h / 2
      };

      // 가장 가까운 3분할 교차점 선택
      let targetPt = rulePoints[0];
      let minDist = Infinity;
      rulePoints.forEach(pt => {
        const d = Math.hypot(pt.x - curCenter.x, pt.y - curCenter.y);
        if (d < minDist) {
          minDist = d;
          targetPt = pt;
        }
      });

      const alignThreshold = Math.min(W, H) * 0.08; // 약 8% 반경 안이면 일치 판정
      const isAligned = minDist <= alignThreshold;

      // 가이드 타깃 링 렌더링
      ctx.save();
      ctx.beginPath();
      ctx.arc(targetPt.x, targetPt.y, alignThreshold, 0, Math.PI * 2);

      if (isAligned) {
        // [완벽한 구도 일치 상태]
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = 'rgba(34, 197, 94, 0.25)';
        ctx.fill();

        updateHUD('✨', isAutoShoot ? '완벽한 구도! 촬영 중...' : '완벽한 구도! 지금 셔터를 누르세요', '#22c55e');

        if (!isLocked) {
          isLocked = true;
          if (navigator.vibrate) navigator.vibrate(50);
          if (isAutoShoot) {
            clearTimeout(lockTimer);
            lockTimer = setTimeout(capturePhoto, 900);
          }
        }
      } else {
        // [구도 보정 필요 상태]
        isLocked = false;
        clearTimeout(lockTimer);

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([8, 6]);
        ctx.stroke();

        // 방향 유도 화살표 및 선분 렌더링
        drawGuideArrow(curCenter, targetPt);

        // 명확한 텍스트 지시 생성
        const dx = targetPt.x - curCenter.x;
        const dy = targetPt.y - curCenter.y;
        generateDirectionInstruction(dx, dy);
      }
      ctx.restore();
    }

    // 명확한 이동 방향 텍스트 HUD 생성
    function generateDirectionInstruction(dx, dy) {
      let horizontal = '';
      let vertical = '';
      let arrow = '';

      if (Math.abs(dx) > 35) {
        horizontal = dx > 0 ? '오른쪽' : '왼쪽';
      }
      if (Math.abs(dy) > 35) {
        vertical = dy > 0 ? '아래' : '위';
      }

      if (horizontal && vertical) {
        arrow = (dx > 0 && dy > 0) ? '↘' : (dx > 0 && dy < 0) ? '↗' : (dx < 0 && dy > 0) ? '↙' : '↖';
        updateHUD(arrow, `카메라를 ${horizontal} ${vertical}로 살짝 이동하세요`, '#0284c7');
      } else if (horizontal) {
        arrow = dx > 0 ? '➔' : '⬅';
        updateHUD(arrow, `카메라를 ${horizontal}으로 이동하세요`, '#0284c7');
      } else if (vertical) {
        arrow = dy > 0 ? '⬇' : '⬆';
        updateHUD(arrow, `카메라를 ${vertical}로 이동하세요`, '#0284c7');
      } else {
        updateHUD('🎯', '조금만 더 원 중심에 맞춰보세요', '#0284c7');
      }
    }

    // 피사체에서 타깃으로 뻗는 화살표 유도선
    function drawGuideArrow(from, to) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 끝단 화살표 헤드
      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const headLen = 14;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - headLen * Math.cos(angle - Math.PI / 6), to.y - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - headLen * Math.cos(angle + Math.PI / 6), to.y - headLen * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
      ctx.restore();
    }

    // 6. 뷰어 및 UI 드로잉 유틸
    function updateHUD(icon, text, bg) {
      hudIcon.innerText = icon;
      hudText.innerText = text;
      if (bg) hudBar.style.background = bg;
    }

    function drawGrid() {
      const W = overlay.width;
      const H = overlay.height;
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 3, 0); ctx.lineTo(W / 3, H);
      ctx.moveTo((W * 2) / 3, 0); ctx.lineTo((W * 2) / 3, H);
      ctx.moveTo(0, H / 3); ctx.lineTo(W, H / 3);
      ctx.moveTo(0, (H * 2) / 3); ctx.lineTo(W, (H * 2) / 3);
      ctx.stroke();
      ctx.restore();
    }

    function drawTargetBox(box, color, label) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.w, box.h);

      // 중심점 마커
      ctx.beginPath();
      ctx.arc(box.x + box.w / 2, box.y + box.h / 2, 6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // 라벨
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(box.x, Math.max(0, box.y - 24), ctx.measureText(label).width + 16, 22);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, box.x + 8, Math.max(16, box.y - 8));
      ctx.restore();
    }

    // 7. 촬영 및 저장
    function capturePhoto() {
      flashOverlay.classList.remove('flash-anim');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-anim');

      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      const cCtx = captureCanvas.getContext('2d');

      // AI 카메라 색감 보정 필터
      cCtx.filter = 'contrast(1.12) saturate(1.18)';
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

      captureCanvas.toBlob(blob => {
        capturedBlob = blob;
        previewImg.src = URL.createObjectURL(blob);
        previewModal.style.display = 'flex';
      }, 'image/jpeg', 0.95);
    }

    shutterBtn.addEventListener('click', capturePhoto);

    autoBtn.addEventListener('click', () => {
      isAutoShoot = !isAutoShoot;
      autoBtn.classList.toggle('active', isAutoShoot);
      document.getElementById('auto-text').innerHTML = isAutoShoot ? 'AUTO<br>ON' : 'AUTO<br>OFF';
    });

    flipBtn.addEventListener('click', async () => {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      await setupCamera();
    });

    btnRetake.addEventListener('click', () => {
      previewModal.style.display = 'none';
      capturedBlob = null;
      isLocked = false;
    });

    btnSave.addEventListener('click', async () => {
      if (!capturedBlob) return;
      const fileName = `perfect_shot_${Date.now()}.jpg`;
      const file = new File([capturedBlob], fileName, { type: 'image/jpeg' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: '완벽한 구도 사진'
          });
          previewModal.style.display = 'none';
          resetToIdle();
          return;
        } catch (e) {}
      }

      const a = document.createElement('a');
      a.href = URL.createObjectURL(capturedBlob);
      a.download = fileName;
      a.click();
      previewModal.style.display = 'none';
      resetToIdle();
    });

    // 시작
    setupCamera().then(() => {
      processLoop();
    });
  </script>
</body>
</html>
